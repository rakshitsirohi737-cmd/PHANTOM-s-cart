<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211e">
  <title>Product details — Phantoms Cart</title>
  <link rel="icon" type="image/svg+xml" href="phantom-cart-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product-details.css">
  <script src="products.js" defer></script>
  <script src="product-details.js" defer></script>
</head>
<body class="product-detail-page">
  <header class="detail-header">
    <a class="wordmark" href="index.html" aria-label="Phantoms Cart home"><img class="brand-logo" src="phantom-cart-logo.svg" alt="" aria-hidden="true">Phantoms Cart</a>
    <a class="detail-cart-link" href="index.html#cart"><span aria-hidden="true">▱</span> Cart <span class="detail-cart-count" id="detail-cart-count">0</span></a>
  </header>

  <main class="detail-main">
    <nav class="detail-breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span aria-hidden="true">/</span><a href="index.html#products">Shop</a><span aria-hidden="true">/</span><span id="detail-breadcrumb-category">Product</span>
    </nav>
    <div class="product-detail-layout" id="product-detail"></div>
    <section class="detail-not-found" id="detail-not-found" hidden>
      <p class="eyebrow">NOT IN THIS AISLE</p>
      <h1>We couldn't find that good thing.</h1>
      <a class="detail-back-link" href="index.html#products">Back to all finds <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <footer class="detail-footer"><a href="index.html">← Back to Phantoms Cart</a><span>Good things for your everyday.</span></footer>
  <div class="detail-toast" id="detail-toast" role="status" aria-live="polite"></div>
</body>
</html>
